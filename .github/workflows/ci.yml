name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (lint, tests, dependency scan)
    runs-on: ubuntu-latest
    env:
      # Test-only values; production secrets must be injected via GitHub
      # Secrets / a secret store, never committed. Rotate to real values.
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-only-secret-key-32+chars-long-please-rotate' }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'ci-test-only-csrf-secret-value-please-rotate' }}
      MONGODB_URI: mongodb://localhost:27017
      GEMINI_API_KEY: ""
      EMAIL_HOST: localhost
      EMAIL_PORT: 1025
      EMAIL_USERNAME: ""
      EMAIL_PASSWORD: ""
      EMAIL_FROM: ci@example.com
      ENABLE_EMAIL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install pip-audit
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
        working-directory: server
      - name: Scan Python dependencies
        continue-on-error: true # report findings without blocking the build
        run: python -m pip_audit -r server/requirements.txt
      - name: Lint (informational)
        continue-on-error: true # pre-existing violations do not block
        run: python -m flake8 . --max-line-length=120
        working-directory: server
      - name: Run backend tests
        run: python -m pytest tests/ -q
        working-directory: server

  frontend:
    name: Frontend (lint, build, tests, dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Scan production dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client
      - name: Scan all dependencies (informational)
        continue-on-error: true # surface dev-tooling findings without blocking
        run: npm audit
        working-directory: client
      - name: Lint
        run: npm run lint
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
      - name: Run frontend tests
        run: npx vitest run
        working-directory: client